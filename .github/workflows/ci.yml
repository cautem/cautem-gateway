# gogpu-style CI: format, lint, cross-platform build + test
name: CI

env:
  CGO_ENABLED: "0"
  GOWORK: ${{ github.workspace }}/go.work

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write  # Codecov OIDC

jobs:
  api-contract:
    name: API contracts
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    defaults:
      run:
        working-directory: cautem-gateway
    steps:
      - uses: actions/checkout@v4
        with:
          path: cautem-gateway
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Lint OpenAPI document
        run: npx --yes @redocly/cli@2.60.0 lint api/openapi.yaml --config api/redocly.yaml
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache-dependency-path: cautem-gateway/go.sum
      - name: Install pinned Buf CLI
        run: go install github.com/bufbuild/buf/cmd/buf@v1.66.0
      - name: Lint and regenerate Control API
        run: |
          buf lint
          buf breaking --against api/schema/control-5e20fa2f6943.binpb
          buf generate
          if [[ -n "$(git status --porcelain -- api/gen)" ]]; then
            echo "generated Control API code is stale"
            git status --short -- api/gen
            exit 1
          fi
      - name: Build generated TypeScript client
        run: |
          npm ci --prefix api/typescript
          npm run check --prefix api/typescript
          if [[ -n "$(git status --porcelain -- api/typescript/src/gen)" ]]; then
            echo "generated TypeScript client is stale"
            git status --short -- api/typescript/src/gen
            exit 1
          fi
      - name: Build management UI
        run: |
          npm ci --prefix ui
          npm run build --prefix ui
      - name: Check Control API compatibility
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main:refs/heads/main
          if git cat-file -e main:buf.yaml 2>/dev/null; then
            if git cat-file -e main:api/proto/cauteum/control/v1/console.proto 2>/dev/null && \
              git cat-file -e HEAD:api/proto/cautem/control/v1/console.proto 2>/dev/null && \
              ! git cat-file -e HEAD:api/proto/cauteum/control/v1/console.proto 2>/dev/null; then
              echo "Skipping the old namespace compatibility check for the intentional cautem contract migration."
            else
              buf breaking --against '.git#branch=main'
            fi
          fi

  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cautem-gateway
    steps:

      - name: Checkout cautem-gateway
        uses: actions/checkout@v4
        with:
          path: cautem-gateway

      - name: Checkout cautem-cli
        uses: actions/checkout@v4
        with:
          repository: cautem/cautem-cli
          path: cautem-cli
          ref: 3f79f643568668def6d7ddd2229bf4ade0a6910d

      - name: Checkout cautem-core
        uses: actions/checkout@v4
        with:
          repository: cautem/cautem-core
          path: cautem-core
          ref: 91a83675f9cf80887fdc652b6031ee863bbd7f55

      - name: Checkout cautem-providers
        uses: actions/checkout@v4
        with:
          repository: cautem/cautem-providers
          path: cautem-providers
          ref: 13b51fcd238cb1a0c4c199ece23cff065a4fcc81

      - name: Checkout cautem-runtime
        uses: actions/checkout@v4
        with:
          repository: cautem/cautem-runtime
          path: cautem-runtime
          ref: eab70d72c3871fa6f7135408edec1e4cf6b3325f

      - name: Checkout cautem-driver
        uses: actions/checkout@v4
        with:
          repository: cautem/cautem-driver
          path: cautem-driver
          ref: a19243085df51ab403f7de3df5d10892d91e22f3

      - name: Checkout cautem-proxy
        uses: actions/checkout@v4
        with:
          repository: cautem/cautem-proxy
          path: cautem-proxy
          ref: baa2ed63f15a25966bbf6794a7483d020cc04ea9

      - name: Checkout slogx
        uses: actions/checkout@v4
        with:
          repository: cautem/slogx
          path: slogx
      - name: Write go.work
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'go 1.27.0'
            echo 'use ('
            for d in cautem-* slogx; do
              [[ "$d" == cautem-cli || "$d" == cautem-display ]] && continue
              if [[ -d "$d" ]]; then
                echo "  ./$d"
              fi
            done
            echo ')'
            echo 'replace ('
            for d in cautem-*; do
              [[ "$d" == cautem-cli || "$d" == cautem-display ]] && continue
              if [[ -d "$d" ]]; then
                echo "  github.com/cautem/${d} v0.1.0-alpha.1 => ./$d"
                echo "  github.com/cautem/${d} v0.1.0-alpha.2 => ./$d"
                echo "  github.com/cautem/${d} v0.1.0-beta.1 => ./$d"
                echo "  github.com/cautem/${d} v0.1.0-beta.2 => ./$d"
                echo "  github.com/cautem/${d} v0.1.6 => ./$d"
              fi
            done
            if [[ -d slogx ]]; then
              echo '  github.com/cautem/slogx v0.1.0-alpha.1 => ./slogx'
              echo '  github.com/cautem/slogx v0.1.0-alpha.2 => ./slogx'
              echo '  github.com/cautem/slogx v0.1.0-beta.1 => ./slogx'
              echo '  github.com/cautem/slogx v0.1.0-beta.2 => ./slogx'
              echo '  github.com/cautem/slogx v0.1.3 => ./slogx'
            fi
            echo ')'
          } > "${{ github.workspace }}/go.work"
          echo "Wrote go.work:" && cat "${{ github.workspace }}/go.work"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache: true
          cache-dependency-path: |
            cautem-*/go.sum
            slogx/go.sum
      - name: Check gofmt
        run: |
          set -euo pipefail
          bad="$(gofmt -l .)"
          if [[ -n "$bad" ]]; then
            echo "ERROR: not formatted:"
            echo "$bad"
            exit 1
          fi
          echo "gofmt: ok"

