# gogpu-style CI: format, lint, cross-platform build + test
name: CI

env:
  CGO_ENABLED: "0"
  GOWORK: ${{ github.workspace }}/go.work

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write  # Codecov OIDC

jobs:
  api-contract:
    name: API contracts
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    defaults:
      run:
        working-directory: cautem-gateway
    steps:
      - uses: actions/checkout@v4
        with:
          path: cautem-gateway
          fetch-depth: 0
      - name: Checkout cautem-proto
        uses: actions/checkout@v4
        with:
          repository: cautem/cautem-proto
          path: cautem-proto
          ref: 35501bd8a5e06cf5fe1a948cec2cabb86827b8d5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Lint OpenAPI document
        run: npx --yes @redocly/cli@2.60.0 lint api/openapi.yaml --config api/redocly.yaml
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache-dependency-path: |
            cautem-gateway/go.sum
            cautem-proto/go.sum
      - name: Install pinned Buf CLI
        run: go install github.com/bufbuild/buf/cmd/buf@v1.66.0
      - name: Lint and regenerate Control API
        working-directory: cautem-proto
        run: |
          buf lint
          buf breaking --against schema/control-5e20fa2f6943.binpb
          buf generate --template buf.gen.yaml
          if [[ -n "$(git status --porcelain -- gen/go)" ]]; then
            echo "generated Control API code is stale"
            git status --short -- gen/go
            exit 1
          fi
      - name: Build generated TypeScript client
        run: |
          npm ci --prefix ../cautem-proto/typescript
          npm run check --prefix ../cautem-proto/typescript
          if [[ -n "$(git -C ../cautem-proto status --porcelain -- typescript/src/gen)" ]]; then
            echo "generated TypeScript client is stale"
            git -C ../cautem-proto status --short -- typescript/src/gen
            exit 1
          fi
      - name: Build management UI
        run: |
          npm ci --prefix ui
          npm run build --prefix ui
      - name: Install browser for UI smoke tests
        working-directory: cautem-gateway/ui
        run: npx playwright install --with-deps chromium webkit
      - name: Test browser console
        run: npm run test:e2e --prefix ui
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.0
      - name: Validate Kubernetes deployment chart
        run: |
          helm lint packaging/helm/cautem
          helm template shared-server packaging/helm/cautem \
            --set database.existingSecret=shared-postgres-credentials >/dev/null
  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cautem-gateway
    steps:

      - name: Checkout cautem-gateway
        uses: actions/checkout@v4
        with:
          path: cautem-gateway

      - name: Checkout cautem-proto
        uses: actions/checkout@v4
        with:
          repository: cautem/cautem-proto
          path: cautem-proto
          ref: 35501bd8a5e06cf5fe1a948cec2cabb86827b8d5

      - name: Checkout cautem-cli
        uses: actions/checkout@v4
        with:
          repository: cautem/cautem-cli
          path: cautem-cli
          ref: dc8f424cd8188fa43afa27e54ae7e3f6d4b3bf6e

      - name: Checkout cautem-core
        uses: actions/checkout@v4
        with:
          repository: cautem/cautem-core
          path: cautem-core
          ref: 3e8578194f94048a5c2619d2e1411eac546de985

      - name: Checkout cautem-providers
        uses: actions/checkout@v4
        with:
          repository: cautem/cautem-providers
          path: cautem-providers
          ref: 82bc5955ced022937e1f84912197d7688d7f7551

      - name: Checkout cautem-runtime
        uses: actions/checkout@v4
        with:
          repository: cautem/cautem-runtime
          path: cautem-runtime
          ref: c84f3581532e32283bc18233325d52159533e9c2

      - name: Checkout cautem-driver
        uses: actions/checkout@v4
        with:
          repository: cautem/cautem-driver
          path: cautem-driver
          ref: b262a04d463be6d81ec01ea99a2016ec0047cd8f

      - name: Checkout cautem-proxy
        uses: actions/checkout@v4
        with:
          repository: cautem/cautem-proxy
          path: cautem-proxy
          ref: dda81bc1d7cf13e403ccbdbd67717d08eb69f98a

      - name: Checkout slogx
        uses: actions/checkout@v4
        with:
          repository: cautem/slogx
          path: slogx
      - name: Write go.work
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'go 1.27.0'
            echo 'use ('
            for d in cautem-* slogx; do
              [[ "$d" == cautem-cli || "$d" == cautem-display ]] && continue
              if [[ -d "$d" ]]; then
                echo "  ./$d"
              fi
            done
            echo ')'
            echo 'replace ('
            for d in cautem-*; do
              [[ "$d" == cautem-cli || "$d" == cautem-display ]] && continue
              if [[ -d "$d" ]]; then
                echo "  github.com/cautem/${d} v0.1.0-alpha.1 => ./$d"
                echo "  github.com/cautem/${d} v0.1.0-alpha.2 => ./$d"
                echo "  github.com/cautem/${d} v0.1.0-beta.1 => ./$d"
                echo "  github.com/cautem/${d} v0.1.0-beta.2 => ./$d"
                echo "  github.com/cautem/${d} v0.1.0 => ./$d"
                echo "  github.com/cautem/${d} v0.1.6 => ./$d"
              fi
            done
            if [[ -d slogx ]]; then
              echo '  github.com/cautem/slogx v0.1.0-alpha.1 => ./slogx'
              echo '  github.com/cautem/slogx v0.1.0-alpha.2 => ./slogx'
              echo '  github.com/cautem/slogx v0.1.0-beta.1 => ./slogx'
              echo '  github.com/cautem/slogx v0.1.0-beta.2 => ./slogx'
              echo '  github.com/cautem/slogx v0.1.3 => ./slogx'
            fi
            echo ')'
          } > "${{ github.workspace }}/go.work"
          echo "Wrote go.work:" && cat "${{ github.workspace }}/go.work"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache: true
          cache-dependency-path: |
            cautem-*/go.sum
            slogx/go.sum
      - name: Check gofmt
        run: |
          set -euo pipefail
          bad="$(gofmt -l .)"
          if [[ -n "$bad" ]]; then
            echo "ERROR: not formatted:"
            echo "$bad"
            exit 1
          fi
          echo "gofmt: ok"

