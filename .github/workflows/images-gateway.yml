name: images-gateway

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - "compose/**"
      - ".github/workflows/images-gateway.yml"
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - "compose/**"
      - ".github/workflows/images-gateway.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/cautem/cautem/gateway
  GOWORK: ${{ github.workspace }}/go.work

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gateway
        uses: actions/checkout@v4
        with:
          path: cautem-gateway
      - name: Checkout deps
        uses: actions/checkout@v4
        with:
          repository: cautem/quarshell-core
          path: cautem-core
          ref: 59fec9b4e887827515979fe01303f2d7152a96f6
      - name: Checkout cautem-proto
        uses: actions/checkout@v4
        with:
          repository: cautem/quarshell-proto
          path: cautem-proto
          ref: 0297d796a01ee3ef2c22aacb57d72080cde8add7
      - uses: actions/checkout@v4
        with:
          repository: cautem/quarshell-cli
          path: cautem-cli
          ref: 51345f24dcb3e34aa30155eac22f5838cc249bc2
      - uses: actions/checkout@v4
        with:
          repository: cautem/quarshell-display
          path: cautem-display
          ref: c58f1a09dd5e0c01ecb96aad5645ecfddbd1d636
      - uses: actions/checkout@v4
        with:
          repository: cautem/quarshell-providers
          path: cautem-providers
          ref: 27c1b456c976a0b0ea2535ba66b4faa3d355f933
      - uses: actions/checkout@v4
        with:
          repository: cautem/quarshell-runtime
          path: cautem-runtime
          ref: 58cca1e35b2b8d7eddc0cbddfefaf6e7172fc215
      - uses: actions/checkout@v4
        with:
          repository: cautem/quarshell-proxy
          path: cautem-proxy
          ref: db748905153b6d7483034d2f20e96c4509996c84
      - uses: actions/checkout@v4
        with:
          repository: cautem/quarshell-driver
          path: cautem-driver
          ref: 2bfed8c08c9c2a3d900980e8b80dcf0898bc17a4
      - uses: actions/checkout@v4
        with:
          repository: cautem/quarshell-sdk
          path: cautem-sdk
          ref: 26cf7232e8f7c1d51da4b8f89a62a7bd229703d6

      - name: Checkout slogx
        uses: actions/checkout@v4
        with:
          repository: cautem/slogx
          path: cautem-slogx
          ref: 82f30eca1d1ff2a61cf8d5d24103cf613fc731db
      - name: Write go.work
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'go 1.27.0'
            echo 'use ('
            for d in cautem-* slogx; do
              if [[ -d "$d" ]]; then
                echo "  ./$d"
              fi
            done
            echo ')'
            echo 'replace ('
            for d in cautem-*; do
              if [[ -d "$d" ]]; then
                echo "  github.com/cautem/${d} v0.1.0-alpha.1 => ./$d"
                echo "  github.com/cautem/${d} v0.1.0-alpha.2 => ./$d"
                echo "  github.com/cautem/${d} v0.1.0-beta.1 => ./$d"
                echo "  github.com/cautem/${d} v0.1.0-beta.2 => ./$d"
                echo "  github.com/cautem/${d} v0.1.0 => ./$d"
                echo "  github.com/cautem/${d} v0.1.6 => ./$d"
              fi
            done
            if [[ -d cautem-slogx ]]; then
              echo '  github.com/cautem/slogx v0.1.0-alpha.1 => ./cautem-slogx'
              echo '  github.com/cautem/slogx v0.1.0-alpha.2 => ./cautem-slogx'
              echo '  github.com/cautem/slogx v0.1.0-beta.1 => ./cautem-slogx'
              echo '  github.com/cautem/slogx v0.1.0-beta.2 => ./cautem-slogx'
              echo '  github.com/cautem/slogx v0.1.3 => ./cautem-slogx'
            fi
            echo ')'
          } > "${{ github.workspace }}/go.work"
          touch "${{ github.workspace }}/go.work.sum"
          echo "Wrote go.work:" && cat "${{ github.workspace }}/go.work"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache: true
          cache-dependency-path: |
            cautem-*/go.sum
            slogx/go.sum
      - uses: docker/setup-buildx-action@v3
      - name: Login GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cautem-gateway/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
