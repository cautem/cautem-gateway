name: images-gateway

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - "ui/**"
      - "compose/**"
      - ".github/workflows/images-gateway.yml"
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - "ui/**"
      - "compose/**"
      - ".github/workflows/images-gateway.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/cautem/cautem/gateway
  CONSOLE_IMAGE: ghcr.io/cautem/cautem/console
  GOWORK: ${{ github.workspace }}/go.work

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gateway
        uses: actions/checkout@v4
        with:
          path: cautem-gateway
      - name: Checkout deps
        uses: actions/checkout@v4
        with:
          repository: cautem/cautem-core
          path: cautem-core
      - name: Checkout cautem-proto
        uses: actions/checkout@v4
        with:
          repository: cautem/cautem-proto
          path: cautem-proto
          ref: 35501bd8a5e06cf5fe1a948cec2cabb86827b8d5
      - uses: actions/checkout@v4
        with:
          repository: cautem/cautem-cli
          path: cautem-cli
          ref: 9ac0a69c307dec1a07bd774cb0a1e10857e26643
      - uses: actions/checkout@v4
        with:
          repository: cautem/cautem-display
          path: cautem-display
      - uses: actions/checkout@v4
        with:
          repository: cautem/cautem-providers
          path: cautem-providers
      - uses: actions/checkout@v4
        with:
          repository: cautem/cautem-runtime
          path: cautem-runtime
      - uses: actions/checkout@v4
        with:
          repository: cautem/cautem-proxy
          path: cautem-proxy
      - uses: actions/checkout@v4
        with:
          repository: cautem/cautem-driver
          path: cautem-driver
      - uses: actions/checkout@v4
        with:
          repository: cautem/cautem-sdk
          path: cautem-sdk
          ref: 202de046bd183ccfe16afd2cd9702771e1fa335b

      - name: Checkout slogx
        uses: actions/checkout@v4
        with:
          repository: cautem/slogx
          path: cautem-slogx
      - name: Write go.work
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'go 1.27.0'
            echo 'use ('
            for d in cautem-* slogx; do
              if [[ -d "$d" ]]; then
                echo "  ./$d"
              fi
            done
            echo ')'
            echo 'replace ('
            for d in cautem-*; do
              if [[ -d "$d" ]]; then
                echo "  github.com/cautem/${d} v0.1.0-alpha.1 => ./$d"
                echo "  github.com/cautem/${d} v0.1.0-alpha.2 => ./$d"
                echo "  github.com/cautem/${d} v0.1.0-beta.1 => ./$d"
                echo "  github.com/cautem/${d} v0.1.0-beta.2 => ./$d"
                echo "  github.com/cautem/${d} v0.1.0 => ./$d"
                echo "  github.com/cautem/${d} v0.1.6 => ./$d"
              fi
            done
            if [[ -d cautem-slogx ]]; then
              echo '  github.com/cautem/slogx v0.1.0-alpha.1 => ./cautem-slogx'
              echo '  github.com/cautem/slogx v0.1.0-alpha.2 => ./cautem-slogx'
              echo '  github.com/cautem/slogx v0.1.0-beta.1 => ./cautem-slogx'
              echo '  github.com/cautem/slogx v0.1.0-beta.2 => ./cautem-slogx'
              echo '  github.com/cautem/slogx v0.1.3 => ./cautem-slogx'
            fi
            echo ')'
          } > "${{ github.workspace }}/go.work"
          touch "${{ github.workspace }}/go.work.sum"
          echo "Wrote go.work:" && cat "${{ github.workspace }}/go.work"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache: true
          cache-dependency-path: |
            cautem-*/go.sum
            slogx/go.sum
      - uses: docker/setup-buildx-action@v3
      - name: Login GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cautem-gateway/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Console meta
        id: console-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.CONSOLE_IMAGE }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push console
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cautem-gateway/ui/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.console-meta.outputs.tags }}
          labels: ${{ steps.console-meta.outputs.labels }}
