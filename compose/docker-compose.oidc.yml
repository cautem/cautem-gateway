# Overlay for OIDC lab: host networking so JWT iss http://127.0.0.1:5556/dex
# matches JWKS fetches from both CLI (host) and gateway.
#
#   docker compose -f cautem-gateway/compose/docker-compose.yml \
#     -f cautem-gateway/compose/docker-compose.oidc.yml --profile oidc up -d --build

services:
  cautem-gateway:
    network_mode: host
    networks: !reset null
    ports: []
    environment:
      CAUTEM_OIDC_ISSUER: ${CAUTEM_OIDC_ISSUER:-http://127.0.0.1:5556/dex}
      CAUTEM_OIDC_CLIENT_ID: ${CAUTEM_OIDC_CLIENT_ID:-cautem-cli}
      CAUTEM_OIDC_ALLOW_INSECURE_HTTP: ${CAUTEM_OIDC_ALLOW_INSECURE_HTTP:-true}

  cautem-console:
    environment:
      CAUTEM_GATEWAY_UPSTREAM: ${CAUTEM_GATEWAY_UPSTREAM:-host.docker.internal:${CAUTEM_GATEWAY_PORT:-7443}}

  dex:
    network_mode: host
    networks: !reset null
    ports: []
